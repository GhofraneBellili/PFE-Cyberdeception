[project]
name = "pfe-cyberdeception"
version = "0.1.0"
description = "PFE - Cyberdeception pilotee par un modele explicable et optimisee sous contraintes"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2,<3",
    "networkx>=3,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
docs = [
    "matplotlib>=3.8,<4",
]
rag = [
    "numpy>=1.26,<3",
    "sentence-transformers>=3,<4",
    "faiss-cpu>=1.8,<2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-m \"not real_llm\""
markers = [
    "real_llm: integration test requiring a real configured LLM provider (excluded by default via addopts, run with -m real_llm)",
]
